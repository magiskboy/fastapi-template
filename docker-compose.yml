services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - mynet
    environment:
      - FASTAPI_DATABASE_URI=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?options=-csearch_path%3Demployees
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: 256M
          cpus: 0.2
        reservations:
          memory: 256M
          cpus: 0.2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else exit(1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:14.18
    ports:
      - "5432:5432"
    networks:
      - mynet
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.2
        reservations:
          memory: 256M
          cpus: 0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  mynet:
